<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bwssh demo stage</title>
<!--
  Animated README demos. Open in a browser to preview (?scene=approve|unlock|keys|audit&lang=zh|en),
  or run render.py to export GIFs. Every frame is a pure function of time, so renders are deterministic.
-->
<style>
  :root {
    --accent: #005fb8;
    --text: #1a1a1a;
    --text2: #5d5d5d;
    --card: rgba(255, 255, 255, 0.72);
    --stroke: rgba(0, 0, 0, 0.0578);
    --green: #0f7b0f;
    --red: #c42b1c;
    --ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    --icons: "Segoe Fluent Icons", "Segoe MDL2 Assets";
    --mono: Consolas, "Microsoft YaHei UI", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  body { font: 14px/20px var(--ui); color: var(--text); -webkit-font-smoothing: antialiased; }
  .i { font-family: var(--icons); font-style: normal; font-weight: normal; line-height: 1; display: inline-block; }

  #viewport { position: relative; width: 960px; height: 600px; overflow: hidden; }
  #world { position: absolute; left: 0; top: 0; width: 1200px; height: 750px; transform-origin: 0 0; overflow: hidden; }

  /* ---------- desktop ---------- */
  #wall {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 70% at 72% 58%, #9fd0ff 0%, rgba(159, 208, 255, 0) 60%),
      radial-gradient(ellipse 50% 60% at 30% 35%, #c7b8ff 0%, rgba(199, 184, 255, 0) 65%),
      radial-gradient(ellipse 70% 50% at 50% 100%, #7fb3f5 0%, rgba(127, 179, 245, 0) 70%),
      linear-gradient(160deg, #dfe9fb 0%, #cfdcf5 45%, #b9ccf0 100%);
  }
  #taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    background: rgba(238, 242, 250, 0.88); border-top: 1px solid rgba(0, 0, 0, 0.08);
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .tb-btn { width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; position: relative; }
  .tb-btn.active { background: rgba(255, 255, 255, 0.7); }
  .tb-btn.active::after { content: ""; position: absolute; bottom: 2px; width: 16px; height: 3px; border-radius: 2px; background: var(--accent); }
  .tb-btn img { width: 24px; height: 24px; }
  .win-logo { width: 22px; height: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .win-logo i { background: linear-gradient(135deg, #3ab0ff, #0067c0); border-radius: 1px; }
  .term-logo { width: 24px; height: 22px; border-radius: 4px; background: #2b2b2b; color: #fff; font: bold 11px/22px var(--mono); text-align: center; }
  .code-logo { width: 22px; height: 22px; border-radius: 5px; background: linear-gradient(135deg, #7ec8ff, #3a8ee6); }
  #tray { position: absolute; right: 12px; top: 0; height: 48px; display: flex; align-items: center; gap: 10px; font-size: 12px; line-height: 16px; }
  #tray .clock { text-align: right; }
  #tray img { width: 16px; height: 16px; }
  #tray .i { font-size: 16px; }

  /* ---------- windows ---------- */
  .window { position: absolute; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 32px 64px rgba(0, 0, 0, 0.28), 0 2px 21px rgba(0, 0, 0, 0.22); }
  .caption-btns { display: flex; height: 100%; }
  .caption-btns span { width: 46px; display: grid; place-items: center; font-size: 10px; }

  /* terminal */
  .term { background: #0c0c0c; color: #cccccc; }
  .term .tabs { height: 40px; background: #202020; display: flex; align-items: flex-end; padding-left: 8px; }
  .term .tab { height: 32px; width: 240px; background: #0c0c0c; border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #fff; font-size: 12px; }
  .term .tab .i { font-size: 12px; }
  .term .tabs .plus { color: #bbb; margin: 0 0 8px 10px; font-size: 12px; }
  .term .tabs .caption-btns { margin-left: auto; height: 40px; color: #ddd; align-self: flex-start; }
  .term pre { font: 16px/23px var(--mono); padding: 12px 16px; white-space: pre-wrap; }
  .t-dim { color: #8a8a8a; } .t-ok { color: #6bd17a; } .t-cyan { color: #61d6d6; } .t-yel { color: #e5c07b; }
  .t-user { color: #fff; } .t-acc { color: #d7875f; } .t-blue { color: #6cb6ff; } .t-bold { color: #fff; font-weight: bold; }
  .caret { display: inline-block; width: 9px; height: 18px; background: #ccc; vertical-align: -3px; }

  /* bwssh main window */
  .app { background: #eef0f5; }
  .app .titlebar { height: 32px; display: flex; align-items: center; font-size: 12px; padding-left: 16px; gap: 12px; }

  .app .body { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; display: flex; }
  .nav { width: 200px; padding: 4px 4px; display: flex; flex-direction: column; }
  .nav .burger { height: 36px; width: 40px; display: grid; place-items: center; margin: 0 0 4px 0; font-size: 16px; }
  .nav .item { position: relative; height: 36px; margin: 2px 0; border-radius: 4px; display: flex; align-items: center; gap: 14px; padding-left: 12px; }
  .nav .item .i { font-size: 16px; width: 16px; }
  .nav .item.sel, .nav .item.hover { background: rgba(0, 0, 0, 0.055); }
  .nav .item.sel::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--accent); }
  .nav .spacer { flex: 1; }
  .content { flex: 1; position: relative; background: rgba(249, 249, 249, 0.62); border-top-left-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.06); border-right: 0; border-bottom: 0; overflow: hidden; }
  .page { position: absolute; inset: 0; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 16px; }
  .ptitle { font-size: 28px; line-height: 36px; font-weight: 600; font-family: "Segoe UI Variable Display", var(--ui); }
  .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 8px; padding: 16px; }
  .strong { font-weight: 600; }
  .sec { color: var(--text2); }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .btn { height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255, 255, 255, 0.78); border: 1px solid rgba(0, 0, 0, 0.0578); border-bottom-color: rgba(0, 0, 0, 0.16); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .btn .i { font-size: 14px; }
  .btn.accent { background: var(--accent); color: #fff; border-color: rgba(255, 255, 255, 0.08); border-bottom-color: rgba(0, 0, 0, 0.4); }
  .btn.hover { background: rgba(249, 249, 249, 0.6); }
  .btn.accent.hover { background: #1a6fc0; }
  .btn.press { transform: scale(0.97); }
  .keycard { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 8px; }
  .keycard > .i { font-size: 20px; }
  .keycard .name { font-weight: 600; }
  .keycard .fp { font: 14px/20px var(--mono); color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .infobar { border-radius: 4px; border: 1px solid var(--stroke); display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; overflow: hidden; }
  .infobar.ok { background: #dff6dd; }
  .infobar .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 9px; margin-top: 2px; flex: none; }
  .infobar .close { margin-left: auto; font-size: 10px; margin-top: 5px; }
  .field { height: 32px; border-radius: 4px; background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 0, 0, 0.0578); border-bottom: 1px solid rgba(0, 0, 0, 0.45); display: flex; align-items: center; padding: 0 11px; gap: 8px; }
  .field.focus { background: #fff; border-bottom: 2px solid var(--accent); }
  .field .ph { color: #8a8a8a; }
  .field .tcaret { display: inline-block; width: 1px; height: 16px; background: #000; margin-left: 1px; vertical-align: -3px; }

  /* audit */
  .entry { display: flex; gap: 12px; padding: 8px 12px; border-radius: 4px; }
  .entry > .i { font-size: 16px; margin-top: 3px; }
  .entry .proc { font-family: var(--ui); }

  /* dialog */
  .smoke { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3); }
  .dialog { position: absolute; left: 50%; top: 50%; width: 540px; background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1), 0 32px 64px rgba(0, 0, 0, 0.19); overflow: hidden; }
  .dialog .top { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .dialog .dtitle { font-size: 20px; line-height: 28px; font-weight: 600; margin-bottom: 4px; }
  .dialog .foot { background: #f3f3f3; border-top: 1px solid rgba(0, 0, 0, 0.06); padding: 24px; display: flex; gap: 8px; }
  .dialog .foot .btn { flex: 1; }
  .selbar { display: flex; gap: 4px; }
  .selbar span { position: relative; padding: 6px 12px 10px; }
  .selbar span.on { font-weight: 600; }
  .selbar span.on::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 16px; margin-left: -8px; height: 3px; border-radius: 2px; background: var(--accent); }
  .ring { width: 24px; height: 24px; border-radius: 50%; border: 3px solid rgba(0, 95, 184, 0.15); border-top-color: var(--accent); }

  /* toast */
  .toast {
    position: absolute; right: 12px; bottom: 60px; width: 364px; border-radius: 8px;
    background: rgba(248, 249, 252, 0.97); border: 1px solid rgba(0, 0, 0, 0.1);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.2); padding: 14px 16px 16px;
  }
  .toast .head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #444; margin-bottom: 12px; }
  .toast .head img { width: 16px; height: 16px; }
  .toast .head .x { margin-left: auto; display: flex; gap: 18px; font-size: 11px; }
  .toast .ttl { font-weight: 600; margin-bottom: 2px; }
  .toast .ln { color: #444; }
  .toast .btns { display: flex; gap: 8px; margin-top: 14px; }
  .toast .btns .btn { flex: 1; padding: 0 6px; font-size: 13px; }
  .btn.success { background: var(--green); color: #fff; border-color: transparent; }
  .btn.critical { background: var(--red); color: #fff; border-color: transparent; }
  .btn.success.hover { background: #1f8a1f; } .btn.critical.hover { background: #d13a2a; }

  /* windows hello */
  .hello { position: absolute; left: 50%; top: 50%; width: 456px; margin-left: -228px; margin-top: -175px; background: #f7f7f7; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 32px 64px rgba(0, 0, 0, 0.3); overflow: hidden; }
  .hello .in { padding: 20px 24px 24px; }
  .hello .brand { font-size: 12px; color: #444; margin-bottom: 16px; }
  .hello .h { font-size: 20px; line-height: 28px; font-weight: 600; }
  .hello .face { width: 120px; height: 120px; margin: 22px auto 14px; position: relative; display: grid; place-items: center; }
  .hello .face svg { position: absolute; inset: 0; }
  .hello .msg { text-align: center; color: #333; min-height: 20px; }
  .hello .foot { background: #eaeaea; padding: 20px 24px; display: flex; justify-content: flex-end; }
  .hello .foot .btn { width: 200px; }

  /* cursor + effects */
  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 26px; transform-origin: 2px 2px; z-index: 50; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid rgba(0, 120, 255, 0.9); background: rgba(0, 120, 255, 0.18); z-index: 49; pointer-events: none; }
  .glow { box-shadow: 0 0 0 3px rgba(0, 95, 184, 0.55), 0 0 24px rgba(0, 95, 184, 0.35) !important; }

  /* captions (outside the camera) */
  #cap {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%); z-index: 100;
    background: rgba(17, 20, 28, 0.82); color: #fff; border-radius: 999px; padding: 9px 20px 9px 12px;
    font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  #cap b { background: #3b8cff; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font-size: 13px; }
</style>

<body>
<div id="viewport">
  <div id="world">
    <div id="wall"></div>
    <div id="scene"></div>
    <div id="taskbar">
      <div class="tb-btn"><div class="win-logo"><i></i><i></i><i></i><i></i></div></div>
      <div class="tb-btn"><span class="i" style="font-size:18px">&#xE721;</span></div>
      <div class="tb-btn" id="tb-term"><div class="term-logo">&gt;_</div></div>
      <div class="tb-btn"><div class="code-logo"></div></div>
      <div class="tb-btn" id="tb-app"><img src="../../src/BwSshAgent.App/Assets/app.png" alt=""></div>
      <div id="tray">
        <span class="i" style="font-size:12px">&#xE70E;</span>
        <img id="tray-icon" src="../../src/BwSshAgent.App/Assets/app.png" alt="">
        <span class="i">&#xE701;</span><span class="i">&#xE767;</span><span class="i">&#xE83F;</span>
        <div class="clock"><div id="clock-time">10:24</div><div>2026/9/26</div></div>
      </div>
    </div>
    <svg id="cursor" viewBox="0 0 26 26"><path d="M2 2 L2 21 L7 16.5 L10.5 24 L14 22.5 L10.6 15.2 L17.2 15.2 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
  <div id="cap"><b>1</b><span></span></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const LANG = params.get("lang") || "zh";
const SCENE = params.get("scene") || "approve";
const L = (zh, en) => (LANG === "zh" ? zh : en);
const ICON = "../../src/BwSshAgent.App/Assets/app.png";
const ICON_LOCKED = "../../src/BwSshAgent.App/Assets/app-locked.ico";

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const easeOut = u => 1 - Math.pow(1 - u, 3);
/** Eased progress of t through [a, b]. */
const prog = (t, a, b, f = ease) => f(clamp((t - a) / (b - a)));
const $ = (sel, root = document) => root.querySelector(sel);
const world = $("#world");

// ---------- geometry: element centers in world coordinates, independent of the camera ----------
let cam = { s: 0.8, tx: 0, ty: 0 };
function center(target, dx = 0, dy = 0) {
  if (Array.isArray(target)) return [target[0] + dx, target[1] + dy];
  const el = typeof target === "string" ? $(target) : target;
  const r = el.getBoundingClientRect();
  return [(r.left + r.width / 2 - cam.tx) / cam.s + dx, (r.top + r.height / 2 - cam.ty) / cam.s + dy];
}

// ---------- cursor ----------
// keys: [time, target, dx?, dy?]; the cursor glides between consecutive keys along a slight arc.
function cursorAt(keys, t) {
  if (t <= keys[0][0]) return center(keys[0][1], keys[0][2], keys[0][3]);
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, a, ax, ay] = keys[i], [t1, b, bx, by] = keys[i + 1];
    if (t <= t1) {
      const p = center(a, ax, ay), q = center(b, bx, by);
      const u = prog(t, t0, t1);
      const arc = Math.sin(Math.PI * u) * 0.12;
      return [lerp(p[0], q[0], u) - (q[1] - p[1]) * arc, lerp(p[1], q[1], u) + (q[0] - p[0]) * arc];
    }
  }
  const k = keys[keys.length - 1];
  return center(k[1], k[2], k[3]);
}

// ---------- camera ----------
// keys: [time, zoom, focus] where focus is a point, selector or "cursor". Zoom 1 shows the whole desktop.
const BASE = 0.8, VW = 960, VH = 600;
const easeCam = u => (u < 0.5 ? 8 * u ** 4 : 1 - (-2 * u + 2) ** 4 / 2); // ease-in-out quart

/**
 * Cursor as seen through a critically damped spring, so a following camera lags and settles with inertia.
 * Simulated from a fixed window before t: older history has decayed away, so each frame stays a pure function of t.
 */
function springCursor(sc, t) {
  const w = 6.5, dt = 1 / 120, t0 = Math.max(0, t - 1.8), steps = Math.round((t - t0) / dt);
  const p = cursorAt(sc.cursor, t0), v = [0, 0];
  for (let i = 1; i <= steps; i++) {
    const g = cursorAt(sc.cursor, t0 + i * dt);
    for (let k = 0; k < 2; k++) {
      v[k] += (w * w * (g[k] - p[k]) - 2 * w * v[k]) * dt;
      p[k] += v[k] * dt;
    }
  }
  return p;
}

/** A camera key resolved at time t, with its focus pulled inside the desktop so the frame never shows past the edge. */
function camKey(sc, [, z, focus], t) {
  const f = focus === "cursor" ? springCursor(sc, t) : center(focus);
  const hw = VW / 2 / (BASE * z), hh = VH / 2 / (BASE * z);
  return { z, f: [clamp(f[0], hw, 1200 - hw), clamp(f[1], hh, 750 - hh)] };
}

function cameraAt(sc, t) {
  const keys = sc.camera;
  let i = keys.findIndex(k => k[0] > t);
  if (i === -1) i = keys.length - 1;
  const a = camKey(sc, keys[Math.max(0, i - 1)], t), b = camKey(sc, keys[i], t);
  const u = i === 0 ? 1 : easeCam(clamp((t - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0])));
  // Zoom interpolates geometrically so 1x→2x feels as even as 2x→4x.
  const z = Math.exp(lerp(Math.log(a.z), Math.log(b.z), u));
  const f = [lerp(a.f[0], b.f[0], u), lerp(a.f[1], b.f[1], u)];
  const s = BASE * z;
  return { s, tx: clamp(VW / 2 - f[0] * s, VW - 1200 * s, 0), ty: clamp(VH / 2 - f[1] * s, VH - 750 * s, 0) };
}

// ---------- shared UI builders ----------
function h(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
const titleBtns = `<div class="caption-btns"><span class="i">&#xE921;</span><span class="i">&#xE922;</span><span class="i">&#xE8BB;</span></div>`;

function terminal(x, y, w, hgt, title) {
  return h(`<div class="window term" id="term" style="left:${x}px;top:${y}px;width:${w}px;height:${hgt}px">
    <div class="tabs"><div class="tab"><span class="i">&#xE756;</span>${title}<span class="i" style="margin-left:auto;font-size:9px">&#xE8BB;</span></div>
      <span class="i plus">&#xE710;</span><span class="i plus" style="font-size:10px">&#xE70D;</span>${titleBtns}</div>
    <pre id="tout"></pre></div>`);
}

function toast({ title, lines, buttons }) {
  return h(`<div class="toast" id="toast">
    <div class="head"><img src="${ICON}">bwssh<div class="x"><span class="i">&#xE712;</span><span class="i">&#xE8BB;</span></div></div>
    <div class="ttl">${title}</div>${lines.map(l => `<div class="ln">${l}</div>`).join("")}
    <div class="btns">${buttons.map(([id, text, cls]) => `<div class="btn ${cls || ""}" id="${id}">${text}</div>`).join("")}</div></div>`);
}

const KEYS = [
  { name: "GitHub", fp: "ssh-ed25519  SHA256:q3Fh8ZtJ0x9vKdR2mB7pLwY4sNcE6uTgHaXiOeV1kUo" },
  { name: L("生产服务器", "Production"), fp: "ssh-ed25519  SHA256:Vd2L9aQx7Rk1mZ3cWfP8yTn0sJhB4uEoKgD6iXrN5tA" },
];
const NEW_KEY = { name: L("家里的 NAS", "Home NAS"), fp: "ssh-ed25519  SHA256:7kTzW2pYcR9aLm4XvQ8dNfH1sJgE3uBoKiC6yZrD0tM" };
const CHAIN_AGENT = "claude.exe → bash.exe → git.exe → ssh.exe";
const GH_HOST = "SHA256:+DiY3wvvV6TuJJhbpZi…";

function keyCard(k, id = "") {
  return `<div class="card keycard" ${id ? `id="${id}"` : ""}><span class="i">&#xE192;</span>
    <div class="grow"><div class="name">${k.name}</div><div class="fp">${k.fp}</div></div>
    <div class="btn copy">${L("复制公钥", "Copy public key")}</div><div class="btn"><span class="i">&#xE712;</span></div></div>`;
}

function appWindow(x, y) {
  const navItem = (id, glyph, text) => `<div class="item" id="${id}"><span class="i">${glyph}</span>${text}</div>`;
  return h(`<div class="window app" id="app" style="left:${x}px;top:${y}px;width:980px;height:660px">
    <div class="titlebar"><img src="${ICON}">bwssh${titleBtns}</div>
    <div class="body">
      <div class="nav">
        <div class="burger i">&#xE700;</div>
        ${navItem("nav-keys", "&#xE8D7;", L("SSH 密钥", "SSH keys"))}
        ${navItem("nav-audit", "&#xE81C;", L("审计日志", "Audit log"))}
        ${navItem("nav-diag", "&#xE9D9;", L("诊断", "Diagnostics"))}
        <div class="spacer"></div>
        ${navItem("nav-settings", "&#xE713;", L("设置", "Settings"))}
      </div>
      <div class="content" id="content">
        <div class="page" id="page-keys">
          <div class="ptitle">${L("SSH 密钥", "SSH keys")}</div>

      $("#page-keys").style.opacity = 1 - sw;
      $("#page-audit").style.opacity = sw;
      $("#page-audit").style.transform = `translateY(${(1 - sw) * 24}px)`;
      $("#filter").classList.toggle("focus", t > 3.25);
      const q = Q.slice(0, Math.floor(clamp((t - 3.7) * 9, 0, Q.length)));
      const caret = t > 3.25 && Math.floor(t * 2.2) % 2 === 0 ? `<span class="tcaret"></span>` : "";
      $("#ftext").innerHTML = q ? q + caret : caret + `<span class="ph">${L("筛选：程序、密钥、目标主机、结果…", "Filter: program, key, host, result…")}</span>`;
      const filtered = q.length === Q.length && t > 4.6;
      const fade = prog(t, 4.6, 4.9);
      document.querySelectorAll(".entry").forEach(e => {
        const match = e.dataset.proc.includes("claude");
        e.style.display = filtered && !match && fade >= 1 ? "none" : "";
        e.style.opacity = match || !filtered ? 1 : 1 - fade;
        e.style.background = match && t > 5.0 && t < 9.5 ? `rgba(0, 95, 184, ${0.07 * prog(t, 5.0, 5.4)})` : "";
      });
    },
  };
};

// ---------- runtime ----------
const sc = scenes[SCENE]();
const cursorEl = $("#cursor"), capEl = $("#cap");
$("#clock-time").textContent = SCENE === "unlock" ? "09:41" : "10:24";
// Ripples live in world space so they zoom with the camera.
const ripples = sc.clicks.map(() => { const r = document.createElement("div"); r.className = "ripple"; world.append(r); return r; });

window.DURATION = sc.duration;
window.CLICKS = sc.clicks;
window.seek = t => {
  sc.frame(t);
  cam = { s: BASE, tx: 0, ty: 0 };
  world.style.transform = `translate(0px, 0px) scale(${BASE})`;
  const c = cameraAt(sc, t);
  const [x, y] = cursorAt(sc.cursor, t);
  const press = sc.clicks.some(ct => t > ct - 0.08 && t < ct + 0.1);
  cursorEl.style.transform = `translate(${x - 2}px, ${y - 2}px) scale(${press ? 0.82 : 1})`;
  sc.clicks.forEach((ct, i) => {
    const u = clamp((t - ct) / 0.55), r = ripples[i];
    r.style.display = t >= ct && u < 1 ? "block" : "none";
    const [px, py] = cursorAt(sc.cursor, ct), d = 12 + 44 * easeOut(u);
    Object.assign(r.style, { left: `${px - d / 2}px`, top: `${py - d / 2}px`, width: `${d}px`, height: `${d}px`, opacity: 1 - u });
  });
  cam = c;
  world.style.transform = `translate(${c.tx}px, ${c.ty}px) scale(${c.s})`;
  const cap = !params.has("nocap") && sc.captions.find(([a, b]) => t >= a && t < b);
  if (cap) {
    const [a, b, n, text] = cap;
    const o = Math.min(prog(t, a, a + 0.3), 1 - prog(t, b - 0.3, b));
    capEl.style.opacity = o;
    capEl.style.transform = `translateX(-50%) translateY(${(1 - o) * -8}px)`;
    capEl.querySelector("b").textContent = n;
    capEl.querySelector("span").textContent = text;
  } else capEl.style.opacity = 0;
};

window.READY = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
if (!params.has("render")) {
  window.READY.then(() => {
    const start = performance.now();
    const tick = () => { window.seek(((performance.now() - start) / 1000) % sc.duration); requestAnimationFrame(tick); };
    tick();
  });
}
</script>
</body>
