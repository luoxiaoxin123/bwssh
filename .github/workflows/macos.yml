name: macOS native packages

on:
  push:
    branches: ["**"]
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
      - "src/BwSshAgent.App/Assets/app.png"
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        default: "1.0.6"
        required: true
        type: string
      architecture:
        description: Architecture to build
        default: all
        type: choice
        options: [all, arm64, x86_64]
      release_tag:
        description: Existing release tag to attach packages to (optional, overrides version)
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: macos-${{ github.event_name }}-${{ github.event_name == 'release' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x86_64' && '["x86_64"]' || '["arm64","x86_64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Resolve package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG:-${INPUT_VERSION:-1.0.6}}"
          version="${version#[vV]}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Verify native runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          swift --version
          xcode-select -p
      - name: Test cryptography and real OpenSSH interoperability
        run: swift test --package-path macos
      - name: Verify SSH on-demand cold and warm launch
        run: python3 macos/check-on-demand.py
      - name: Build native application, ZIP and DMG
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: python3 macos/package.py --arch "$PACKAGE_ARCH" --version "$PACKAGE_VERSION"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: bwssh-macos-${{ matrix.arch }}
          path: |
            artifacts/macos/${{ matrix.arch }}/*.zip
            artifacts/macos/${{ matrix.arch }}/*.dmg
            artifacts/macos/${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Attach packages to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          dir="artifacts/macos/$PACKAGE_ARCH"
          cp "$dir/SHA256SUMS" "$dir/SHA256SUMS-macos-$PACKAGE_ARCH.txt"
          gh release upload "$RELEASE_TAG" "$dir"/*.zip "$dir"/*.dmg "$dir/SHA256SUMS-macos-$PACKAGE_ARCH.txt" --clobber
