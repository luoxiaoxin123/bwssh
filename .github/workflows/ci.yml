name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure OpenSSH client (used by tests)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SystemRoot\System32\OpenSSH\ssh-keygen.exe")) {
            Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
          }

      - name: Test
        run: dotnet test --project tests/BwSshAgent.Core.Tests

      - name: Publish and verify
        shell: pwsh
        run: ./build.ps1 -Version 0.0.0 -SkipInstaller
